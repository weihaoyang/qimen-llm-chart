  - '2026-10-14: **修复人类图 BodyGraph 两个菱形中心飘出盘面并在悬停时疯狂抖动，发布 20261014-f9a81e1**（用户报告「人类图为什么有两个飘在外面鼠标移上去会疯狂抖动的块」）。根因：阿基那与 G中心 用 rect + transform="rotate(45 cx cy)" 绘制，而样式为让 hover 缩放绕形状自身中心设了 `transform-box: fill-box` / `transform-origin: center`；该组合同样作用于 SVG transform 属性，把「绕用户坐标点旋转」按 fill-box 局部坐标解读，菱形被推到数百像素外（实测包围盒 226x154 / 366x89，漂移 +93/-71 与 +180/-39），并因 SVG `overflow: visible` 压在右侧读数区上；而 hover 的 `transform: scale(1.08)` 会整条替换属性 transform，指针一移上去形状即跳走、:hover 失效再触发 —— 表现为疯狂抖动。修法：菱形改为用 path 直接画四个顶点（半对角线 25√2，与原 50x50 转 45° 形状一致），中心形状一律不再带 transform 属性。验证：本地与线上各测 9 个中心 drift 全 0/0、无一溢出盘面、无一压到读数区、0 个形状带 transform 属性；悬停几何为纯缩放 matrix(1.08,0,0,1.08,0,0)、圆心漂移 0、放大后指针仍在形状内；新增测试钉住「中心形状不得带 transform 属性 + 形状词表 6 path/3 rect」；npm run ci 122 文件 / 696 通过 / 2 skipped、eslint 0 error、next build 通过。发布后线上 /api/version 回显 20261014-f9a81e1、/paipan 200、控制台 0 条消息；回滚目标 20261013-f3d7f86。无数据库迁移。'
