    - '奇门遁甲：只保留默认（符头定元）口径；「拆补 / 茅山」已整体撤下（上游自注未通过自验、茅山可算出负局数、其四柱随宿主时区变化）。'
    - '八字：旺衰权重 / 从格门槛 / 调候取用为本仓启发式；古籍摘录未逐字校对，只能引作「据《书名·篇目》大意」，「编者按」不得挂书名引用。'
    - '术数研究 · 人生 K 线：线型权重与 STAGE_SCORE 为本仓启发式（非古籍算法）。'
    - '阿卡西记录：非可计算体系，只列知识条目与伦理边界，不提供任何「读取」。'
    - '铁板神数 / 邵子神数：已整体移除（条文文本可分发性未决——仓库 LICENSE 为 Apache-2.0 但同仓 README 称「仅供学习交流使用」；邵子的条文与编号规则则未获许可允许且可核验的来源）。'
    - '三盘联合：只做聚合与对照，不产出任何自动吉凶断语。'
  frontend:
    - '标题栏分组是**固定三行**而不是自动换行：721–1559.98px 为「身份 + 复制盘面资料 + 账户 / 体系标签条独占整宽 / 盘面操作(改时间·资料库·使用说明·出生档案)」，≥1560px 才是单行 masthead。只有标签条允许伸缩，其余容器都必须 `flex: 0 0 auto`，否则会被压扁、内部按钮换行堆叠（标签条也会被挤到两百来像素）。上界写成 1559.98px 是刻意的：亚像素视口（缩放/DPR）落在 1559–1560 之间时两条媒体查询都不命中，会退回 block 布局。'
    - '手机端（≤720px）的排版权威文件是 `src/app/paipan/mobile.css`：它的选择器特异性高于 `qimen-workbench.css` 里同名段落，改奇门手机字号只改前者才生效（后者那段同名规则是被压住的死规则）。奇门宫格在手机上只有 ~122px 一格，字号必须按格宽定：19px 的「天柱」需要 38px 而格子只有 35px，会满盘省略号；长星名（中宫「天芮天禽」）应当折行而不是截断。'
    - '奇门盘面字号按**卡片自身尺寸**定（≥721px：卡片 `container-type: inline-size` + `@container` 分档；主要值 clamp(10px,(卡片−10)/12.6,24px)、事实值 clamp(12px,((卡片−10)/3−20)/3.9,15px)），卡片 ≤215px 时事实栏两列且「势」独占整行，≤150px 时主区两列——这些都是"按尺寸让字号/布局适配"，不是把内容裁掉。容器类型必须用 `inline-size`：用 `size` 会让卡片高度不再由内容决定，矮窗口下"盘面按内容定高"就不成立。窗口矮（≤760px 高）时盘面不再压扁：整条链按内容定高 + `align-self: start`（居中会让溢出跑到上方，既不可达也不计入 scrollHeight）+ 画布列可滚动 + 卡片确定高度 124px。'
    - '体系标签条按**名字宽度**分页（不再等宽）：`paginateTabs()` 用"汉字 1em / 西文 0.58em / 空格 0.34em + 排版开销"估每个标签的盒宽，逐页装满可用宽度，因此任何视口下都不会有体系被省略号裁掉（一页容量也随之变大：1000px 下 12 个、1440px 下 17 个）。分页依赖"量到的宽度"，因此除 ResizeObserver 外还有两道兜底：渲染后发现标签溢出列表就按列表真实宽度收紧；挂载后 400/1200/2600ms 再核对（账户/套餐状态是异步到达的，会把标签条挤窄）。改这段逻辑时务必保持"整页宽度 ≤ 可用宽度"这一不变量。'
    - 'SVG 形状不得带 `transform` 属性（如 `rect` + `rotate(45 …)`）：样式里为了 hover 缩放绕形状中心而设的 `transform-box: fill-box` / `transform-origin: center` 会一并作用于该属性，改变其参考坐标系；hover 的 `transform: scale(…)` 又会整条替换属性 transform，造成形状跳出容器并在指针下反复触发/失效（人类图菱形中心曾如此疯狂抖动）。需要旋转的图形请直接用 `path` 画出顶点。'
    - '首屏时间占位：服务端不可能知道访客时钟，默认盘面时间先用「水合安全常量」（`HYDRATION_SAFE_DATE` + `HYDRATION_SAFE_TIME_ZONE`，即 2000-01-01 20:00）渲染，挂载后替换为访客真实时间——首帧会有一次时间替换，这是为水合一致性刻意付出的代价。时钟文本（改时间 meta、排盘时间、引导摘要）按 React 对时间戳的约定带 `suppressHydrationWarning`；其余区域仍是严格水合校验，禁止给非时钟内容加该属性。默认盘面时间必须按传入时区落值（`formatDateTimeInputInZone`），不得用 `Date#getHours()` 这类进程本地读法，否则生产（进程时区 UTC）会与访客（+08）渲染出不同文本。'
    - '首屏 JS 体积（2026-10-15 实测）：`/paipan` 首次加载 JS = 4805 KB raw / 1572 KB gzip，其中 649 KB raw 的页面 chunk 装着**所有体系的面板与引擎**，另有 1714 KB raw 的共享 vendor chunk（主要为 `recharts`，仅 K 线图用；以及 `assistant-ui`/`radix`，仅 AI 对话面板用）。出处材料本体已改为按需 chunk（每体系统一个，展开「出处与原文」或打开「资料库」时才取），实测只有 ~26 KB gzip / ~9 KB 内联 HTML 的收益——想继续减必须对「非首屏才需要的面板/库」做动态加载，而不是继续动材料。'
